<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      .wrap {
        position: relative;
        display: flex;
      }

      #froala-editor,
      #froala-editor-mobile,
      #preview {
        width: 50%;
      }

      #preview {
        /*860 + 2/820*/
        /* display: none; */
        position: absolute;
        top: 0;
        left: 21px;
        width: calc(var(--w) - 42px - 5.5px);
        z-index: 1;
        background-color: pink;
        opacity: 0.5;

        pointer-events: none;
        user-select: none;

        font-size: 14px;
        line-height: 1.6;
      }

      #controls {
        position: fixed;
        bottom: 10px;
        right: 10px;
        z-index: 9999;
      }

      .wrap.latest #preview {
        font-size: 13.89px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="froala-editor"></div>
      <div id="froala-editor-mobile"></div>
      <div id="preview" class="fr-view">
        <p>
          Start typing and you can preview the content of the WYSIWYG HTML
          editor as you type below the editing box.
        </p>
      </div>
    </div>
    <div id="controls">
      <button id="copy">copy</button>
      <button id="toggle-preview">Toggle Preview</button>
    </div>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/jquery@latest/dist/jquery.min.js"
    ></script>
    <script>
      const { v } = Object.fromEntries(new URLSearchParams(location.search));
      const version = v || "4.1.4";

      function loadFroalaEditor(selector, options) {
        const script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/npm/froala-editor@" +
          version +
          "/js/froala_editor.pkgd.min.js";
        script.type = "text/javascript";
        script.onload = function () {
          init();
        };

        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href =
          "https://cdn.jsdelivr.net/npm/froala-editor@" +
          version +
          "/css/froala_editor.pkgd.min.css";

        document.head.appendChild(link);
        document.head.appendChild(script);
      }

      function resize() {
        const w = $("#froala-editor .fr-view").outerWidth();

        $("#preview").attr(
          "style",
          `
          --w: ${w}px;
          top: ${$("#froala-editor .fr-toolbar").outerHeight() + 20}px;
        `,
        );
      }

      function addEvent() {
        $("#toggle-preview").on("click", function () {
          $("#preview").toggle();
        });

        $("#copy").on("click", function () {
          const $mobile = $("#froala-editor-mobile");

          if ($mobile.length === 0) return;

          const m = $mobile.get(0)["data-froala.editor"];
          var pc = $("#froala-editor .fr-view").html();

          $mobile.find(".fr-view").html(pc);
          $mobile.find(".fr-wrapper").removeClass("show-placeholder");

          m.events.trigger("contentChanged");
        });

        $(window).on("resize", function () {
          resize();
        });
      }

      function initFroala() {
        if (version.startsWith("latest")) {
          $(".wrap").addClass("latest");
        }

        new FroalaEditor("div#froala-editor", {
          events: {
            contentChanged: function () {
              $("#preview").html(this.html.get());
            },
            initialized: function () {
              resize();
            },
          },
        });

          events: {

le='margin-top:0cm;margin-right:0cm;margin-bottom:0cm;margin-left:0cm;line-height:normal;font-size:15px;font-family:"Cambria",serif;'>$9.60</p></td></tr><tr><td valign="top" style="width: 33.3333%; border-width: medium 1pt 1pt; border-style: none solid solid; border-color: currentcolor rgb(79, 129, 189) rgb(79, 129, 189); border-image: none; background: rgb(211, 223, 238); padding: 0cm 5.4pt; vertical-align: top;"><p style='margin-top:0cm;margin-right:0cm;margin-bottom:0cm;margin-left:0cm;line-height:normal;font-size:15px;font-family:"Cambria",serif;'><strong><span style='font-family:"Calibri",sans-serif;color:black;'>Marker</span></strong></p></td><td valign="top" style="width: 33.3333%; border-width: medium 1pt 1pt medium; border-style: none solid solid none; border-color: currentcolor rgb(79, 129, 189) rgb(79, 129, 189) currentcolor; background: rgb(211, 223, 238); padding: 0cm 5.4pt; vertical-align: top;"><p style='margin-top:0cm;margin-right:0cm;margin-bottom:0cm;margin-left:0cm;line-height:normal;font-size:15px;font-family:"Cambria",serif;'><span style="color:black;">5</span></p></td><td valign="top" style="width: 33.3333%; border-width: medium 1pt 1pt medium; border-style: none solid solid none; border-color: currentcolor rgb(79, 129, 189) rgb(79, 129, 189) currentcolor; background: rgb(211, 223, 238); padding: 0cm 5.4pt; vertical-align: top;"><p style='margin-top:0cm;margin-right:0cm;margin-bottom:0cm;margin-left:0cm;line-height:normal;font-size:15px;font-family:"Cambria",serif;'><span style="color:black;">$11.25</span></p></td></tr></tbody></table><h1 style='margin-top:24.0pt;margin-right:0cm;margin-bottom:0cm;margin-left:0cm;line-height:115%;font-size:19px;font-family:"Calibri",sans-serif;color:#365F91;'>Image</h1><p style='margin-top:0cm;margin-right:0cm;margin-bottom:10.0pt;margin-left:0cm;line-height:115%;font-size:15px;font-family:"Cambria",serif;'>An embedded raster image:</p><p style='margin-top:0cm;margin-right:0cm;margin-bottom:10.0pt;margin-left:0       function init() {

      $(function () {
